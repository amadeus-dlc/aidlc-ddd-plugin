# このリポジトリで takt が使うプロバイダとモデル。~/.takt/runtime.yaml は読まない
# (scripts/run-takt.sh が TAKT_CONFIG_DIR を .takt/global へ向けるため)。
version: 1
# 実装中に並走するレビュー companion を有効にする。以前は ~/.takt/runtime.yaml から受け継いでいた。
companion:
  enabled: true
provider:
  profiles:
    opus-5-5:
      provider: claude
      model: claude-opus-5-5
  # すべてのステップ（レビュアー群・companion・その moderator を含む）を Claude Opus 5.5 で動かす。
  # Claude Opus 5 と Claude Fable 5.1 は使わない。
  defaults:
    profile: opus-5-5

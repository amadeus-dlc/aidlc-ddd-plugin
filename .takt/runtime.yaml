# このリポジトリで takt が使うプロバイダとモデル。~/.takt/runtime.yaml は読まない
# (起動時に TAKT_CONFIG_DIR を .takt/global へ向けるため)。
#
# 割り当て (2026-10-05 に合意):
# - 計画 (planner) は Claude Opus 5.5
# - 実装・修正 (coder) は Claude Sonnet 5.5
# - レビュー (coding-reviewer) は GPT-6.1-Sol (effort high)。実装と別の系統で独立に見る
# - そのほか (companion・moderator など) は Claude Sonnet 5.5
#
# Claude と Codex のアカウントは起動のたびに選ぶ。TAKT_CLAUDE_CLI_PATH に scripts/takt-claude.sh、
# TAKT_CODEX_CLI_PATH に scripts/takt-codex.sh を絶対パスで渡し、TAKT_CLAUDE_ACCOUNT_DIR と
# TAKT_CODEX_ACCOUNT_DIR に使うアカウントの設定ディレクトリを渡す。
version: 1
# 実装中に並走するレビュー companion を有効にする。
companion:
  enabled: true
provider:
  profiles:
    opus-5-5:
      provider: claude
      model: claude-opus-5-5
    # provider: claude は Claude CLI の stdout を文字列に溜め、10MB を超えるとステップを失敗させる
    # (takt 0.66・0.67 の claude-headless/headless-spawn.js。上限は設定で変えられない)。長い実装ステップが
    # 87 分動いた後にこれで失敗した実績がある (#70)。claude-sdk は出力を逐次受け取るため、この上限が無い。
    sonnet-5-5-sdk:
      provider: claude-sdk
      model: claude-sonnet-5-5
    sol-high:
      provider: codex
      model: gpt-6.1-sol
      options:
        reasoning_effort: high
  defaults:
    profile: sonnet-5-5-sdk
  targets:
    personas:
      planner:
        profile: opus-5-5
      coder:
        profile: sonnet-5-5-sdk
      coding-reviewer:
        profile: sol-high

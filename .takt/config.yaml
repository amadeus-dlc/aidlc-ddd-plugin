# このリポジトリのプロジェクト層の takt 設定。
#
# レート制限時の切り替え先 (rate_limit_fallback) は置かない。すべてのステップが Claude Opus 5.5 で動き、
# Claude Opus 5 と Claude Fable 5.1 は使わないため、切り替え先の候補が無い。制限に当たったステップは
# 中断するので、`takt list` の Requeue で止まった位置から再開する。
#
# .takt/ をソースコードとして探索させない。
#
# takt はタスクの clone に .takt/runs/ (指示書・レポート・ログ) を作る。Grep ツールは .takt/.gitignore に
# 従ってこれを除外するが、Bash の `grep -r` や `find` は .gitignore を見ないため、指示書やレポートが
# ソースコードの検索結果に混ざる (#77、#115 の実行で発生)。一方で、各ステップは指示書とレポートを
# .takt/runs/ から読むので、読むこと自体は禁じない。
#
# 文字列の quality_gates は、takt がすべてのステップの指示文の「完了条件」節に差し込む。
workflow_overrides:
  quality_gates:
    # >- は改行を空白に置き換えるため、日本語の途中では折り返さず、英字や記号の前でだけ折り返す。
    - >-
      `.takt/` をソースコードとして探索していない。`.takt/` は takt の作業領域
      (指示書・レポート・ログ・他のタスクの記録) であり、ソースコードではない。
      Bash の `grep -r` や `find` は `.gitignore` を見ないので、`--exclude-dir=.takt` や
      `-path ./.takt -prune` で必ず除外する。探索結果に `.takt/` 配下のファイルが混ざったら、判断の根拠にも変更の対象にもしない。
      指示やレポートの参照先として示された `.takt/runs/` 配下のファイルは、そのパスを指定して読んでよい。
